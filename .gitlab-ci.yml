workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

stages:
  - build
  - release

build-exe:
  stage: build
  tags:
    - saas-windows-medium-amd64
  script:
    - python --version
    - python -m venv build_env
    - 'build_env\Scripts\activate'
    - pip install pyinstaller
    - '$tag = $env:CI_COMMIT_TAG -replace "^v",""'
    - '$parts = $tag.Split(".")'
    - '$v = "$($parts[0]), $($parts[1]), $($parts[2]), 0"'
    - '(Get-Content version.txt) -replace "\(\d+, \d+, \d+, \d+\)", "($v)" | Set-Content version.txt'
    - 'pyinstaller --onefile --windowed --name inaudible_batch --version-file version.txt inaudible_batch.py'
    - '$hash = (Get-FileHash dist\inaudible_batch.exe -Algorithm SHA256).Hash.ToLower()'
    - 'echo "SHA256=$hash" | Out-File -FilePath build.env -Encoding utf8 -Append'
    - '$version = $env:CI_COMMIT_TAG'
    - '$zipName = "m4b_to_mp3_${version}.zip"'
    - 'echo "ZIP_NAME=$zipName" | Out-File -FilePath build.env -Encoding utf8 -Append'
    - 'New-Item -ItemType Directory -Path release_staging'
    - 'Copy-Item dist\inaudible_batch.exe release_staging\'
    - 'Copy-Item README.md               release_staging\'
    - 'Copy-Item INSTALL.md              release_staging\'
    - 'Copy-Item CHANGELOG.md            release_staging\'
    - 'Compress-Archive -Path release_staging\* -DestinationPath $zipName'
  artifacts:
    paths:
      - dist/inaudible_batch.exe
      - "m4b_to_mp3_*.zip"
      - install_shortcut.py
    reports:
      dotenv: build.env
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-exe
      artifacts: true
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    name: "$CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: |
      ## M4B to MP3 Batch Converter $CI_COMMIT_TAG

      ### Download
      - **m4b_to_mp3_$CI_COMMIT_TAG.zip** — Windows standalone bundle (no Python required)
      - **install_shortcut.py** — Python users: place alongside `inaudible_batch.py`, run once to create a Desktop shortcut

      Getting started (no Python): unzip anywhere, run `inaudible_batch.exe`.
      Getting started (Python): place `inaudible_batch.py` in a folder, run `python install_shortcut.py`.

      Requires ffmpeg installed separately. See INSTALL.md.

      SmartScreen warning: click More info then Run anyway.

      SHA256: $SHA256
    assets:
      links:
        - name: "m4b_to_mp3_$CI_COMMIT_TAG.zip"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/m4b_to_mp3_$CI_COMMIT_TAG.zip?job=build-exe"
          link_type: package
        - name: "install_shortcut.py"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/install_shortcut.py?job=build-exe"
          link_type: other
